server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Résolveur interne de Docker. Sans lui, nginx fige l'adresse de l'API au
    # démarrage et sert du 502 dès que le conteneur API est recréé avec une
    # nouvelle IP — pire, cette IP peut avoir été réattribuée à l'API d'une
    # AUTRE application. Passer par une variable force la résolution à chaque
    # requête ; comme `$api` ne porte pas de chemin, l'URI d'origine est
    # transmise telle quelle.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        set $api http://flotte-api:3000;
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Dépôt des documents véhicule (cartes grises / blanches) : la
        # limite API est de 20 Mo par fichier, on laisse un peu de marge.
        client_max_body_size 25m;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
